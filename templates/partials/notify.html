    <!-- ================= Pas encore décidé ================= -->
    <section id="notify" class="reveal {{padding}} py-16 sm:py-24">
      <div class="rounded-2xl sm:rounded-3xl bg-ink text-white flex flex-col items-center justify-center text-center px-6 sm:px-20 py-16 sm:py-20">
        <h2 class="font-display text-display-md max-w-[24ch] text-white">Pas encore décidé&nbsp;?</h2>
        <p class="mt-8 max-w-[42ch] text-[1.25rem] font-medium text-lin-400">
          Laissez votre email&nbsp;: je vous préviens quand la première enquête est prête, et rien d'autre.
        </p>
        <form id="notify-form" class="mt-10 flex w-full max-w-md flex-col sm:flex-row gap-3" novalidate>
          <label for="notify-email" class="sr-only">Votre email</label>
          <input id="notify-email" name="email" type="email" required autocomplete="email"
                 placeholder="vous@exemple.fr"
                 class="flex-1 rounded border border-lin-700 bg-transparent px-4 py-3 text-base text-white placeholder:text-lin-500 focus:outline-none focus:ring-2 focus:ring-primary focus:border-primary" />
          <button type="submit" class="rounded bg-white px-5 py-3 text-sm font-semibold text-ink hover:bg-lin-100 transition-colors">
            Prévenez-moi
          </button>
        </form>
        <p id="notify-msg" role="status" aria-live="polite" class="mt-3 text-sm"></p>
      </div>
    </section>
